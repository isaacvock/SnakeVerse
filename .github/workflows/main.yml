name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Config, lint, dry-run, and full workflow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Snakemake test environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakeverse-ci
          create-args: >-
            python=3.12
            snakemake
            pyyaml
            pytest
            fastqc
            fastp
            cutadapt
            sra-tools
            pigz
            bowtie2
            bwa-mem2
            star
            samtools
            bedtools
            macs3
            subread
            gffread
            salmon
            rsem
            deeptools
            multiqc
            umi_tools
            pysam
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          cache-environment: true

      - name: Python syntax checks
        run: |
          python -m py_compile \
            config/bin/ngsflow.py \
            workflow/lib/config.py \
            workflow/lib/params.py \
            workflow/lib/refs.py \
            workflow/lib/samples.py \
            workflow/lib/clip.py \
            workflow/lib/tracks.py \
            workflow/lib/validation.py \
            workflow/scripts/gtf_to_gene_saf.py \
            workflow/scripts/qname_umi_to_rx.py
          PYTHONPATH=workflow/lib python - <<'PY'
          from params import tool_extra
          from samples import rsem_strandedness_arg

          legacy = {"tools": {"x": {"extra": "--legacy"}}}
          staged = {"tools": {"x": {"extra": {"index": "--large", "align": "--local"}}}}
          assert tool_extra(legacy, "x", "align") == "--legacy"
          assert tool_extra(staged, "x", "index") == "--large"
          assert tool_extra(staged, "x", "align") == "--local"
          assert tool_extra(staged, "x", "quant") == ""
          sample = [{"sample_id": "s1", "unit_id": "u1", "strandedness": "reverse"}]
          assert rsem_strandedness_arg(sample, "s1") == "--strandedness reverse"
          PY
          pytest -q tests/test_eclip.py

      - name: Generate CLIP fixtures
        run: |
          python .test/scripts/generate_eclip_fastqs.py
          bash .test/scripts/smoke_eclip_preprocessing.sh

      - name: Helper script checks
        run: |
          python config/bin/ngsflow.py list assays
          python config/bin/ngsflow.py list recipes --assay generic
          python config/bin/ngsflow.py list recipes --assay rnaseq
          python config/bin/ngsflow.py list recipes --assay atacseq
          python config/bin/ngsflow.py list recipes --assay eclip
          python config/bin/ngsflow.py explain --configfile .test/configs/generic.yaml
          python config/bin/ngsflow.py explain alignment --configfile .test/configs/generic.yaml
          python config/bin/ngsflow.py explain trimming --configfile .test/configs/generic.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/generic.yaml
          python config/bin/ngsflow.py explain --configfile .test/configs/rnaseq.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/rnaseq.yaml
          python config/bin/ngsflow.py explain --configfile .test/configs/atacseq.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/atacseq.yaml
          python config/bin/ngsflow.py explain --configfile .test/configs/generic_bwa_mem2.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/generic_bwa_mem2.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/generic_sra.yaml
          python config/bin/ngsflow.py explain preprocessing --configfile .test/configs/eclip_encode.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/eclip_encode.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/ecclip_2026.yaml
          python config/bin/ngsflow.py validate --configfile .test/configs/eclip_preextracted.yaml

      - name: Recipe initialization smoke test
        run: |
          smoke_dir="$(mktemp -d)"
          cp -a config "$smoke_dir/config"
          cd "$smoke_dir"
          python config/bin/ngsflow.py init-run \
            --assay rnaseq \
            --recipe star_featurecounts \
            --genome hg38 \
            --run-name smoke
          python config/bin/ngsflow.py explain alignment
          python config/bin/ngsflow.py explain tool rsem > rsem-explain.txt
          grep -q "estimate_rspd" rsem-explain.txt
          grep -q "SnakeVerse supplies FASTA/GTF/reference prefixes" rsem-explain.txt
          test -f config/runs/smoke.yaml
          test -f config/samples/smoke.tsv
          test -f config/references/hg38.yaml
          test -f config/tools/star.yaml
          test -f config/tools/featurecounts.yaml
          test -f config/tools/cutadapt.yaml
          test -f config/tools/sra_tools.yaml
          test -f config/tools/bowtie2.yaml
          test -f config/tools/bwa_mem2.yaml
          test -f config/tools/salmon.yaml
          test -f config/tools/rsem.yaml
          echo "# preserve-me" >> config/tools/star.yaml
          python config/bin/ngsflow.py init-run \
            --assay generic \
            --recipe fastq_to_bam \
            --genome hg38 \
            --run-name smoke-generic
          grep -q "preserve-me" config/tools/star.yaml
          python config/bin/ngsflow.py init-run \
            --assay eclip \
            --recipe encode_eclip \
            --genome hg38 \
            --run-name smoke-eclip
          python config/bin/ngsflow.py init-run \
            --assay eclip \
            --recipe karimzadeh_ecclip_2026 \
            --genome hg38 \
            --run-name smoke-ecclip
          test -f config/tools/umi_tools.yaml

      - name: Snakemake lint
        run: |
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/generic.yaml --lint
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/rnaseq.yaml --lint
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/atacseq.yaml --lint
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/generic_bwa_mem2.yaml --lint
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/eclip_encode.yaml --lint
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/ecclip_2026.yaml --lint
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/eclip_preextracted.yaml --lint

      - name: Snakemake dry-runs
        run: |
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/generic.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/rnaseq.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/atacseq.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/generic_bwa_mem2.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/generic_sra.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/eclip_encode.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/ecclip_2026.yaml --dry-run --cores 2 --printshellcmds
          snakemake --snakefile workflow/Snakefile --configfile .test/configs/eclip_preextracted.yaml --dry-run --cores 2 --printshellcmds

      - name: Full generic FASTQ-to-BAM run
        run: |
          snakemake --snakefile workflow/Snakefile \
            --configfile .test/configs/generic.yaml \
            --cores 2 \
            --printshellcmds \
            --show-failed-logs \
            --latency-wait 30

      - name: Full RNA-seq run
        run: |
          snakemake --snakefile workflow/Snakefile \
            --configfile .test/configs/rnaseq.yaml \
            --cores 2 \
            --printshellcmds \
            --show-failed-logs \
            --latency-wait 30
          test -s .test/results/rnaseq/counts/featurecounts/gene_counts.txt
          test -s .test/results/rnaseq/counts/featurecounts/exon_strict_counts.txt
          test -s .test/results/rnaseq/counts/featurecounts/full_gene_counts.txt
          test -s .test/results/rnaseq/counts/salmon/WT_1/quant.sf
          test -s .test/results/rnaseq/counts/salmon/WT_1/quant.genes.sf
          test -s .test/results/rnaseq/reference/star/configured_index/Genome
          test -e .test/results/rnaseq/reference/star/configured_index/.snakeverse_star_index.done

      - name: Full ATAC-seq run
        run: |
          snakemake --snakefile workflow/Snakefile \
            --configfile .test/configs/atacseq.yaml \
            --cores 2 \
            --printshellcmds \
            --show-failed-logs \
            --latency-wait 30
          test -s .test/results/atacseq/bam/filtered/K562_ATAC_rep1.bam
          test -s .test/results/atacseq/bam/filtered/K562_ATAC_rep2.bam
          test -s .test/results/atacseq/qc/atac/K562_ATAC_rep1.frip.txt
          test -s .test/results/atacseq/qc/atac/K562_ATAC_rep2.frip.txt
          test -e .test/results/atacseq/peaks/macs3/K562_ATAC_rep1/K562_ATAC_rep1_peaks.narrowPeak
          test -e .test/results/atacseq/peaks/macs3/K562_ATAC_rep2/K562_ATAC_rep2_peaks.narrowPeak

      - name: Full conventional eCLIP run
        run: |
          snakemake --snakefile workflow/Snakefile \
            --configfile .test/configs/eclip_encode.yaml \
            --cores 2 --printshellcmds --show-failed-logs --latency-wait 30
          test -s .test/results/eclip_encode/bam/pre_dedup/PUM2_IP_1.bam
          test -s .test/results/eclip_encode/bam/umi_dedup/PUM2_IP_1.bam
          samtools view .test/results/eclip_encode/bam/pre_dedup/PUM2_IP_1.bam | grep -q 'RX:Z:'
          test "$(samtools view -c .test/results/eclip_encode/bam/umi_dedup/PUM2_IP_1.bam)" \
            -lt "$(samtools view -c .test/results/eclip_encode/bam/pre_dedup/PUM2_IP_1.bam)"
          test -s .test/results/eclip_encode/tracks/crosslink_sites/PUM2_IP_1.plus.bw
          test -s .test/results/eclip_encode/tracks/enrichment/PUM2_IP_1.vs.PUM2_SMI_1.plus.bw

      - name: Full Karimzadeh ecCLIP run
        run: |
          snakemake --snakefile workflow/Snakefile \
            --configfile .test/configs/ecclip_2026.yaml \
            --cores 2 --printshellcmds --show-failed-logs --latency-wait 30
          test -s .test/results/ecclip_2026/bam/pre_dedup/RBP_IP_1.bam
          test -s .test/results/ecclip_2026/bam/umi_dedup/RBP_IP_1.bam
          samtools view .test/results/ecclip_2026/bam/pre_dedup/RBP_IP_1.bam | grep -q 'RX:Z:'
          test "$(samtools view -c .test/results/ecclip_2026/bam/umi_dedup/RBP_IP_1.bam)" \
            -lt "$(samtools view -c .test/results/ecclip_2026/bam/pre_dedup/RBP_IP_1.bam)"
          test -s .test/results/ecclip_2026/tracks/crosslink_sites/RBP_IP_1.plus.bw
          test ! -e .test/results/ecclip_2026/tracks/enrichment/RBP_IP_1.vs.TAG_1.plus.bw

      - name: Full pre-extracted eCLIP run
        run: |
          snakemake --snakefile workflow/Snakefile \
            --configfile .test/configs/eclip_preextracted.yaml \
            --cores 2 --printshellcmds --show-failed-logs --latency-wait 30
          samtools view .test/results/eclip_preextracted/bam/pre_dedup/PRE_IP_1.bam | grep -q 'RX:Z:'
          test "$(samtools view -c .test/results/eclip_preextracted/bam/umi_dedup/PRE_IP_1.bam)" \
            -lt "$(samtools view -c .test/results/eclip_preextracted/bam/pre_dedup/PRE_IP_1.bam)"
