schema_version: 2
created_from: {recipe: fastq_to_bam, version: 1}
project: {name: snakeverse_ci, run_name: generic}
assay: generic
samples: .test/configs/samples/generic.tsv
reference: .test/configs/references/test_genome.yaml
results_dir: .test/results/generic

modules:
  sra_download: {enabled: false}
  fastq_qc: {enabled: true}
  trimming:
    enabled: true
    tool: fastp
    adapters: {mode: auto, read1: null, read2: null}
  alignment: {enabled: true, tool: bowtie2}
  mark_duplicates: {enabled: false}
  bam_filter:
    enabled: true
    min_mapq: 10
    required_flags: null
    excluded_flags: 1804
    keep_duplicates: true
    exclude_contigs: []
  bam_qc: {enabled: true}
  coverage: {enabled: true, strand_mode: none}
  multiqc: {enabled: true}

resources:
  fastqc: {threads: 1, mem_mb: 512, runtime_min: 15}
  fastp: {threads: 2, mem_mb: 1024, runtime_min: 30}
  bowtie2: {threads: 2, mem_mb: 2048, runtime_min: 60}
  bowtie2_index: {threads: 2, mem_mb: 2048, runtime_min: 60}
  samtools_filter: {threads: 2, mem_mb: 1024, runtime_min: 30}
  samtools_qc: {threads: 1, mem_mb: 512, runtime_min: 15}
  deeptools: {threads: 2, mem_mb: 1024, runtime_min: 30}
  multiqc: {threads: 1, mem_mb: 512, runtime_min: 15}
