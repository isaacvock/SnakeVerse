catalog_version: 2

assays:
  generic:
    description: "Generic FASTQ-to-BAM workflow for custom assays."
    toolbox:
      - fastqc
      - fastp
      - cutadapt
      - sra_tools
      - bowtie2
      - bwa_mem2
      - star
      - samtools
      - deeptools
      - multiqc
    recipes:
      fastq_to_bam:
        description: "FASTQ QC, trimming, Bowtie2 alignment, BAM filtering, QC, and coverage."
        run_template: recipes/generic_fastq_to_bam.yaml
        sample_template: samples/generic.tsv

  rnaseq:
    description: "Bulk RNA-seq workflow."
    toolbox:
      - fastqc
      - fastp
      - cutadapt
      - sra_tools
      - star
      - bowtie2
      - bwa_mem2
      - samtools
      - featurecounts
      - salmon
      - rsem
      - deeptools
      - multiqc
    recipes:
      star_featurecounts:
        description: "STAR alignment plus featureCounts gene quantification."
        run_template: recipes/rnaseq_star_featurecounts.yaml
        sample_template: samples/rnaseq.tsv

  atacseq:
    description: "ATAC-seq chromatin accessibility workflow."
    toolbox:
      - fastqc
      - fastp
      - cutadapt
      - sra_tools
      - bowtie2
      - bwa_mem2
      - samtools
      - bedtools
      - macs3
      - deeptools
      - multiqc
    recipes:
      encode4_bowtie2_macs3:
        description: "ENCODE4-oriented Bowtie2 alignment, filtering, MACS3 peaks, signal, and QC."
        run_template: recipes/atacseq_encode4.yaml
        sample_template: samples/atacseq.tsv

  eclip:
    description: "eCLIP/ecCLIP alignment, UMI deduplication, and CLIP signal tracks."
    toolbox:
      - fastqc
      - cutadapt
      - fastp
      - sra_tools
      - umi_tools
      - star
      - samtools
      - deeptools
      - multiqc
    recipes:
      encode_eclip:
        description: "Conventional paired-end ENCODE eCLIP with inline barcodes and a 5-nt R2 UMI."
        run_template: recipes/eclip_encode.yaml
        sample_template: samples/eclip_encode.tsv
      karimzadeh_ecclip_2026:
        description: "Karimzadeh et al. ecCLIP with an 8-nt UMI-only R2 and single-end R1 alignment."
        run_template: recipes/ecclip_karimzadeh_2026.yaml
        sample_template: samples/ecclip_karimzadeh_2026.tsv
