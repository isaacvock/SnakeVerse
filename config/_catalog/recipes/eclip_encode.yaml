# Conventional ENCODE/Yeo-lab paired-end eCLIP preprocessing and signal tracks.
schema_version: 2

created_from:
  recipe: encode_eclip
  version: 1

project:
  name: example_project
  run_name: "{{RUN_NAME}}"

assay: eclip
samples: config/samples/{{RUN_NAME}}.tsv
reference: config/references/{{GENOME}}.yaml
results_dir: results/{{RUN_NAME}}

preprocessing:
  input_stage: raw

modules:
  fastq_qc:
    enabled: true

  inline_barcode_demultiplexing:
    enabled: true
    read: R1
    end: 5prime
    max_mismatches: 0
    allow_indels: false

  umi_extraction:
    enabled: true
    method: string
    read1:
      role: biological
    read2:
      pattern: NNNNN
      location: 5prime
      role: biological

  trimming:
    enabled: true
    tool: cutadapt
    adapters:
      mode: sequences
      read1: AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
      read2: AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
    params:
      quality_cutoff: "20,20"
      minimum_length: 20
      times: 2

  alignment:
    enabled: true
    tool: star
    transcriptome_bam: false
    params:
      align:
        outFilterMultimapNmax: 1
        alignEndsType: EndToEnd
        quantMode: ""

  mark_duplicates:
    enabled: false

  bam_filter:
    enabled: true
    min_mapq: 255
    required_flags: 2
    excluded_flags: 2828
    keep_duplicates: true
    exclude_contigs: []

  umi_deduplication:
    enabled: true
    method: directional
    edit_distance: 1
    strand_aware: true
    spliced_is_unique: true
    umi_tag: RX
    qname_regex: "_(?P<umi>[ACGTN]+)$"

  bam_qc:
    enabled: true

  coverage:
    enabled: true
    strand_mode: separate
    read: R2
    strand: reverse
    params:
      bin_size: 10
      normalize_using: CPM
      min_mapping_quality: 10
      ignore_duplicates: false
      extend_reads: false

  crosslink_sites:
    enabled: true
    read: R2
    end: 5prime
    strand: reverse
    min_mapping_quality: 10

  enrichment:
    enabled: true
    read: R2
    strand: reverse
    bin_size: 50
    pseudocount: 1
    min_mapping_quality: 10

  multiqc:
    enabled: true

resources:
  fastqc: {threads: 1, mem_mb: 1024, runtime_min: 30}
  cutadapt_demultiplex: {threads: 4, mem_mb: 4096, runtime_min: 120}
  umi_tools_extract: {threads: 1, mem_mb: 4096, runtime_min: 120}
  cutadapt: {threads: 4, mem_mb: 4096, runtime_min: 120}
  star: {threads: 12, mem_mb: 32000, runtime_min: 360}
  star_index: {threads: 8, mem_mb: 32000, runtime_min: 480}
  samtools_filter: {threads: 4, mem_mb: 4096, runtime_min: 120}
  umi_tools_tag: {threads: 1, mem_mb: 4096, runtime_min: 120}
  umi_tools_dedup: {threads: 1, mem_mb: 8192, runtime_min: 240}
  samtools_qc: {threads: 2, mem_mb: 2048, runtime_min: 60}
  deeptools: {threads: 4, mem_mb: 4096, runtime_min: 120}
  multiqc: {threads: 1, mem_mb: 2048, runtime_min: 60}
