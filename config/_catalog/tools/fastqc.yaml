# FastQC options. SnakeVerse supplies the input FASTQ, output directory, and
# thread count. Set a value to null/false to omit it; true emits a bare flag.
# Docs: https://www.bioinformatics.babraham.ac.uk/projects/fastqc/
tool: fastqc
version: "0.13"

params:
  # Suppress routine console progress messages. Errors still go to the log.
  quiet: false

# Appended verbatim after params and before workflow-controlled I/O arguments.
extra: ""
